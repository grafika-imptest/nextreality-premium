<!doctype html>
<html lang="cs" data-office="tgh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developerské projekty | NEXT Reality</title>
<script>if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !location.search.includes('nomotion')) { document.documentElement.classList.add('js-motion'); setTimeout(() => { if (!window.gsap) document.documentElement.classList.remove('js-motion'); }, 2500); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="premium.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="projects.css">
</head>
<body data-page="projekty">
<div id="site-header"></div>
<main>
  <!-- Hlavička výpisu: text vlevo, mapa projektů vpravo (piny reagují na filtr štítků) -->
  <section class="pj-hero" aria-labelledby="pj-h1">
    <div class="wide pj-hero__in">
      <div>
        <nav class="crumbs" aria-label="Drobečková navigace"><a data-href="index.html">Domů</a><span aria-hidden="true">/</span><span aria-current="page">Developerské projekty</span></nav>
        <h1 id="pj-h1" data-split>Developerské projekty</h1>
        <p class="pj-hero__lead">Objevte developerské projekty, které přinášejí moderní bydlení, promyšlenou architekturu a atraktivní lokality. Nabízíme nové byty pro vlastní bydlení i investici.</p>
        <dl class="pj-hero__stats" id="pj-stats"></dl>
      </div>
      <div class="pj-map" id="pj-map" role="region" aria-label="Mapa developerských projektů" data-lenis-prevent></div>
    </div>
  </section>

  <section class="wide" aria-label="Filtr a výsledky">
    <div class="pj-filter" id="pj-filter"></div>
    <div class="pj-results"><p id="pj-info" aria-live="polite"></p><button type="button" class="pj-reset" id="pj-reset" hidden>Zrušit filtr</button></div>
    <div class="pj-grid" id="pj-grid"></div>
    <div class="pj-empty" id="pj-empty" hidden><b>Této kombinaci štítků neodpovídá žádný projekt.</b><button type="button" class="btn btn--secondary" data-pj-reset>Zobrazit všechny projekty</button></div>
    <div style="height:var(--section-editorial)"></div>
  </section>
</main>
<div id="site-footer"></div>
<script src="data.js"></script>
<script src="data/phase3.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="core.js"></script>
<script src="projekty.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/split-type@0.3.4/umd/index.min.js" defer></script>
<script src="motion.js" defer></script>
</body>
</html>
